# Calamares module configuration for Darlinx Profile Selection
# https://github.com/calamares/calamares/wiki/ModuleFormat

[config]
module = "Darlinx-ProfileSelect"
name = "Profile Selection"
description = "Choose your application profiles for optimal setup"
icon = "preferences-desktop-profile"

# UI settings
view_size = 800, 600
allow_cancel = true

# Profile list configuration (auto-reads from profiles.json)
profiles_dir = "../iso/profiles/"
base_profile = "base.sh"

# Logging
verbose = true
log_file = "/tmp/darlinx-profile-select.log"