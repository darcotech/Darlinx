<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     width="400" height="400" viewBox="0 0 400 400">
  
  <defs>
    <!-- Darlinx Color Palette -->
    <style>
      .base-color { fill: #1e3a5f; }       /* Deep blue - Base */
      .cad-color { fill: #2563eb; }        /* Bright blue - CAD */
      .dev-color { fill: #7c3aed; }        /* Purple - Developer */
      .ai-color { fill: #059669; }         /* Green - AI/ML */
      .office-color { fill: #dc2626; }     /* Red - Office */
      .gamer-color { fill: #ea580c; }      /* Orange - Gaming */
      .webdev-color { fill: #f59e0b; }     /* Amber - WebDev */
      .ad-color { fill: #6366f1; }         /* Indigo - AD */
      
      .white { fill: #ffffff; }
      .bg-base { fill: #f1f5f9; }
    </style>
    
    <!-- Reusable Icon Background -->
    <rect class="bg-base" x="0" y="0" width="50" height="50" rx="8" id="icon-bg"/>
  </defs>
  
  <!-- 
    ICON GRID LAYOUT (50x50 each):
    Row 1: Base, CAD, Dev, AI, Office
    Row 2: Gamer, WebDev, AD
  -->
  
  <!-- ========== BASE PROFILE ICON ========== -->
  <g id="icon-base">
    <use href="#icon-bg" class="base-color"/>
    <!-- Desktop/System Icon -->
    <rect x="10" y="12" width="30" height="20" rx="2" fill="#ffffff" opacity="0.9"/>
    <rect x="15" y="35" width="8" height="5" rx="1" fill="#ffffff"/>
    <rect x="27" y="35" width="8" height="5" rx="1" fill="#ffffff"/>
    <rect x="18" y="40" width="14" height="2" fill="#ffffff"/>
  </g>
  
  <!-- ========== CAD/3D PROFILE ICON ========== -->
  <g id="icon-cad">
    <use href="#icon-bg" class="cad-color"/>
    <!-- Wireframe Cube (3D) -->
    <path d="M25 12 L40 20 L25 28 L10 20 Z" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M25 12 V32 M40 20 V40 M25 28 V48 M10 20 V40" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="25" cy="36" r="4" fill="#ffffff" opacity="0.3"/>
  </g>
  
  <!-- ========== DEV PROFILE ICON ========== -->
  <g id="icon-dev">
    <use href="#icon-bg" class="dev-color"/>
    <!-- Code Brackets + Terminal -->
    <rect x="12" y="14" width="26" height="22" rx="3" fill="#ffffff" opacity="0.95"/>
    <path d="M18 20 L14 26 L18 32" fill="none" stroke="#1e1b4b" stroke-width="2" stroke-linecap="round"/>
    <path d="M32 20 Q28 26 32 32" fill="none" stroke="#1e1b4b" stroke-width="2" stroke-linecap="round"/>
    <rect x="17" y="19" width="2" height="2" fill="#1e1b4b"/>
    <rect x="28" y="30" width="2" height="2" fill="#1e1b4b"/>
  </g>
  
  <!-- ========== AI/ML PROFILE ICON ========== -->
  <g id="icon-ai">
    <use href="#icon-bg" class="ai-color"/>
    <!-- Brain + Neural Network -->
    <ellipse cx="25" cy="18" rx="10" ry="6" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="25" cy="32" rx="10" ry="6" fill="#ffffff" opacity="0.7"/>
    <path d="M15 18 V24 M35 18 V24 M15 32 V26 M35 32 V26" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="25" cy="25" r="5" fill="#ffffff" opacity="0.95"/>
    <!-- Neural connections -->
    <path d="M18 18 L32 32 M32 18 L18 32" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
  </g>
  
  <!-- ========== OFFICE PROFILE ICON ========== -->
  <g id="icon-office">
    <use href="#icon-bg" class="office-color"/>
    <!-- Document Icon -->
    <rect x="14" y="12" width="22" height="26" rx="2" fill="#ffffff" opacity="0.95"/>
    <path d="M23 12 V18 L30 18 M23 18 H30" fill="none" stroke="#b91c1c" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="18" y1="20" x2="30" y2="20" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="18" y1="24" x2="30" y2="24" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="18" y1="28" x2="26" y2="28" stroke="#ffffff" stroke-width="1.5"/>
  </g>
  
  <!-- ========== GAMER PROFILE ICON ========== -->
  <g id="icon-gamer">
    <use href="#icon-bg" class="gamer-color"/>
    <!-- Gamepad Icon -->
    <rect x="12" y="20" width="26" height="14" rx="7" fill="#ffffff" opacity="0.95"/>
    <circle cx="18" cy="27" r="3" fill="#ffffff"/>
    <circle cx="32" cy="24" r="2" fill="#ffffff"/>
    <circle cx="32" cy="30" r="2" fill="#ffffff"/>
    <!-- Directional Cross -->
    <rect x="15" y="23" width="6" height="3" rx="1" fill="#c2410c"/>
    <rect x="18" y="21" width="3" height="6" rx="1" fill="#c2410c"/>
  </g>
  
  <!-- ========== WEBDEV PROFILE ICON ========== -->
  <g id="icon-webdev">
    <use href="#icon-bg" class="webdev-color"/>
    <!-- Globe/Network Icon -->
    <circle cx="25" cy="25" r="10" fill="#ffffff" opacity="0.95"/>
    <ellipse cx="25" cy="25" rx="8" ry="4" fill="none" stroke="#d97706" stroke-width="1"/>
    <ellipse cx="25" cy="25" rx="3" ry="8" fill="none" stroke="#d97706" stroke-width="1"/>
    <circle cx="25" cy="25" r="2" fill="#d97706"/>
    <!-- Network nodes -->
    <circle cx="20" cy="25" r="1.5" fill="#fbbf24"/>
    <circle cx="30" cy="25" r="1.5" fill="#fbbf24"/>
    <circle cx="25" cy="20" r="1.5" fill="#fbbf24"/>
    <circle cx="25" cy="30" r="1.5" fill="#fbbf24"/>
  </g>
  
  <!-- ========== AD/ENTERPRISE PROFILE ICON ========== -->
  <g id="icon-ad">
    <use href="#icon-bg" class="ad-color"/>
    <!-- Network + Users -->
    <circle cx="25" cy="16" r="4" fill="#ffffff" opacity="0.95"/>
    <path d="M25 22 V28 M20 34 H30" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <!-- Secondary users (domain nodes) -->
    <circle cx="14" cy="20" r="2.5" fill="#ffffff" opacity="0.7"/>
    <circle cx="36" cy="20" r="2.5" fill="#ffffff" opacity="0.7"/>
    <path d="M18 18 L14 22 M32 18 L36 22" stroke="#ffffff" stroke-width="1.5"/>
  </g>
  
  <!-- ========== LEGEND / LABELS ========== -->
  <!-- Row 1 Labels -->
  <text x="10" y="70" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#64748b">Base</text>
  <text x="60" y="70" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#64748b">CAD</text>
  <text x="110" y="70" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#64748b">Dev</text>
  <text x="160" y="70" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#64748b">AI</text>
  <text x="210" y="70" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#64748b">Office</text>
  
  <!-- Row 2 Labels -->
  <text x="260" y="70" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#64748b">Gamer</text>
  <text x="310" y="70" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#64748b">WebDev</text>
  <text x="360" y="70" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#64748b">AD</text>
  
  <!-- ========== SEPARATE INDIVIDUAL ICON FILES ========== -->
  <!-- These can be extracted for individual use in the installer -->
  
  <!-- Base Profile Icon (Standalone) -->
  <g id="base-profile-icon" transform="translate(0, 100)">
    <rect x="0" y="0" width="50" height="50" rx="8" fill="#1e3a5f"/>
    <rect x="10" y="12" width="30" height="20" rx="2" fill="#ffffff" opacity="0.9"/>
    <rect x="15" y="35" width="8" height="5" rx="1" fill="#ffffff"/>
    <rect x="27" y="35" width="8" height="5" rx="1" fill="#ffffff"/>
    <rect x="18" y="40" width="14" height="2" fill="#ffffff"/>
  </g>
  
  <!-- CAD Profile Icon (Standalone) -->
  <g id="cad-profile-icon" transform="translate(60, 100)">
    <rect x="0" y="0" width="50" height="50" rx="8" fill="#2563eb"/>
    <path d="M25 12 L40 20 L25 28 L10 20 Z" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M25 12 V32 M40 20 V40 M25 28 V48 M10 20 V40" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="25" cy="36" r="4" fill="#ffffff" opacity="0.3"/>
  </g>
  
  <!-- Dev Profile Icon (Standalone) -->
  <g id="dev-profile-icon" transform="translate(120, 100)">
    <rect x="0" y="0" width="50" height="50" rx="8" fill="#7c3aed"/>
    <rect x="12" y="14" width="26" height="22" rx="3" fill="#ffffff" opacity="0.95"/>
    <path d="M18 20 L14 26 L18 32" fill="none" stroke="#1e1b4b" stroke-width="2" stroke-linecap="round"/>
    <path d="M32 20 Q28 26 32 32" fill="none" stroke="#1e1b4b" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- AI Profile Icon (Standalone) -->
  <g id="ai-profile-icon" transform="translate(180, 100)">
    <rect x="0" y="0" width="50" height="50" rx="8" fill="#059669"/>
    <ellipse cx="25" cy="18" rx="10" ry="6" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="25" cy="32" rx="10" ry="6" fill="#ffffff" opacity="0.7"/>
    <circle cx="25" cy="25" r="5" fill="#ffffff" opacity="0.95"/>
  </g>
  
  <!-- Office Profile Icon (Standalone) -->
  <g id="office-profile-icon" transform="translate(240, 100)">
    <rect x="0" y="0" width="50" height="50" rx="8" fill="#dc2626"/>
    <rect x="14" y="12" width="22" height="26" rx="2" fill="#ffffff" opacity="0.95"/>
    <path d="M23 12 V18 L30 18 M23 18 H30" fill="none" stroke="#b91c1c" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  
  <!-- Gamer Profile Icon (Standalone) -->
  <g id="gamer-profile-icon" transform="translate(0, 160)">
    <rect x="0" y="0" width="50" height="50" rx="8" fill="#ea580c"/>
    <rect x="12" y="20" width="26" height="14" rx="7" fill="#ffffff" opacity="0.95"/>
    <circle cx="18" cy="27" r="3" fill="#ffffff"/>
    <circle cx="32" cy="24" r="2" fill="#ffffff"/>
    <circle cx="32" cy="30" r="2" fill="#ffffff"/>
  </g>
  
  <!-- WebDev Profile Icon (Standalone) -->
  <g id="webdev-profile-icon" transform="translate(60, 160)">
    <rect x="0" y="0" width="50" height="50" rx="8" fill="#f59e0b"/>
    <circle cx="25" cy="25" r="10" fill="#ffffff" opacity="0.95"/>
    <ellipse cx="25" cy="25" rx="8" ry="4" fill="none" stroke="#d97706" stroke-width="1"/>
  </g>
  
  <!-- AD Profile Icon (Standalone) -->
  <g id="ad-profile-icon" transform="translate(120, 160)">
    <rect x="0" y="0" width="50" height="50" rx="8" fill="#6366f1"/>
    <circle cx="25" cy="16" r="4" fill="#ffffff" opacity="0.95"/>
    <path d="M25 22 V28 M20 34 H30" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>

</svg> 